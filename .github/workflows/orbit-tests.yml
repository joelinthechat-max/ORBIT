name: ORBIT tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "audit/**"]

permissions:
  contents: read

jobs:
  unit-and-static-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Python unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONNOUSERSITE: "1"
        run: python -m unittest discover -s tests -v

      - name: Compile Python source
        run: python -m compileall -q orbit tests

      - name: Check dashboard JavaScript syntax
        run: node --check orbit/static/app.js

      - name: Check Linux shell launcher syntax
        if: runner.os == 'Linux'
        run: |
          sh -n run_linux.sh
          if [ -f setup_browser_linux.sh ]; then sh -n setup_browser_linux.sh; fi

      - name: Validate configuration JSON
        run: python -m json.tool CONFIG/orbit.json > "${{ runner.temp }}/orbit-config-validated.json"
